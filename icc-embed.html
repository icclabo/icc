<iframe
  id="icc-research-figure"
  src="icc-animated.html"
  title="Interactive ICC Lab research framework"
  loading="lazy"
  style="display:block;width:100%;height:700px;border:0;"
></iframe>
<script>
(() => {
  const frame = document.getElementById('icc-research-figure');
  window.addEventListener('message', event => {
    if (event.origin !== window.location.origin || event.source !== frame.contentWindow) return;
    if (event.data?.type !== 'icc-figure-height') return;
    const height = event.data.height;
    if (typeof height !== 'number' || !Number.isFinite(height) || height < 100 || height > 10000) return;
    const value = Math.ceil(height) + 'px';
    if (frame.style.height !== value) frame.style.height = value;
  });
})();
</script>
